version: "3"

networks:
  local:
  local-proxy:
    external: true

services:
  site:
    image: docker.io/library/node:24-bookworm-slim
    restart: unless-stopped
    working_dir: /workspace
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      LOCAL_DEV_HTTP: "1"
      PUBLIC_SITE_URL: "http://site.wax-attic-splash.localhost"
    command: >
      sh -lc "node_modules/.bin/astro dev --host 0.0.0.0 --port 4321"
    expose:
      - "4321"
    labels:
      - traefik.enable=true
      - traefik.docker.network=local-proxy
      - traefik.http.routers.wax-attic-splash-site.entrypoints=web
      - traefik.http.routers.wax-attic-splash-site.rule=Host(`site.wax-attic-splash.localhost`)
      - traefik.http.services.wax-attic-splash-site.loadbalancer.server.port=4321
    networks:
      - local
      - local-proxy
    volumes:
      - .:/workspace:Z
